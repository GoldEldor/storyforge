<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyless AI Web App</title>
    <!-- 1. Load Puter.js Library (No API Keys Needed) -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 700px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 12px; 
            background: #1e293b; 
            color: white; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 10px;
        }
        input[type="file"] { 
            background: #1e293b; 
            color: white; 
            padding: 10px; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            width: 100%; 
            margin-top: 10px; 
            box-sizing: border-box; 
        }
        button { 
            background: #10b981; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 15px; 
            font-weight: bold;
        }
        button:hover { background: #059669; }
        .response { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 20px; 
            border: 1px solid #334155; 
            white-space: pre-wrap; 
            word-break: break-word; 
        }
        label { font-weight: bold; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>StoryForge AI (Puter.js Keyless)</h1>

    <label for="fileInput">Upload a Text File (optional):</label><br>
    <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json,.md"><br><br>

    <label for="promptInput">Your Instruction:</label><br>
    <textarea id="promptInput" placeholder="Ask the AI to analyze your file, write code, or solve a problem..."></textarea><br>

    <button id="submitBtn">Generate Response</button>

    <div id="output" class="response" style="display: none;"></div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const promptInput = document.getElementById('promptInput').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const outputDiv = document.getElementById('output');
            const submitBtn = document.getElementById('submitBtn');

            if (!promptInput.trim() && !fileInput) {
                alert("Please enter a prompt or attach a file!");
                return;
            }

            submitBtn.innerText = "Thinking...";
            submitBtn.disabled = true;
            outputDiv.style.display = "block";
            outputDiv.innerText = "Processing request with AI...";

            let fileContent = "";

            // Read the uploaded file text if provided
            if (fileInput) {
                try {
                    fileContent = await fileInput.text();
                } catch (err) {
                    fileContent = "[Error reading file]";
                }
            }

            // Combine prompt and file contents
            let fullPrompt = promptInput;
            if (fileContent) {
                fullPrompt = `Uploaded File Content:\n\n${fileContent}\n\nUser Instruction:\n${promptInput}`;
            }

            try {
                // Call AI using Puter.js (No API key needed!)
                const response = await puter.ai.chat(fullPrompt);
                outputDiv.innerText = response;
            } catch (error) {
                outputDiv.innerText = "Error calling AI: " + error.message;
            } finally {
                submitBtn.innerText = "Generate Response";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
